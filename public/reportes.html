<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraData | Registrar Infraestructura</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background-color: #f4f7f6; display: flex;">

    <div class="dashboard-container" style="width: 100%; display: flex;">
        <nav class="sidebar" style="width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px;">
            <h2>🏢 InfraData</h2><br>
            <ul style="list-style: none; padding: 0; line-height: 2.5;">
                <li><a href="panel_usuario.html" style="color: white; text-decoration: none;">📍 Panel Principal</a></li>
                <li style="background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px;">📝 Crear Reporte</li>
                <li><a href="login.html" style="color: #ff6b6b; text-decoration: none; display:block; margin-top:30px;">🚪 Cerrar Sesión</a></li>
            </ul>
        </nav>

        <main style="flex: 1; padding: 40px; overflow-y: auto; height: 100vh;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Registrar Nueva Infraestructura</h2>
                <span style="background: #d4edda; color: #155724; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">ODS 9: Innovación</span>
            </div>
            
            <p style="color: #666; margin-bottom: 30px;">Complete los detalles del proyecto de infraestructura para el monitoreo comunitario.</p>

            <form id="formReporte" style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);" onsubmit="event.preventDefault(); return false;">
                
                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div style="flex: 1;">
                        <label style="font-weight: bold; color: #333;">Nombre del Proyecto</label>
                        <input type="text" id="nombreProyecto" required placeholder="Ej: Red de Energía Solar Norte" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-weight: bold; color: #333;">Tipo de Tecnología (ODS 9)</label>
                        <select id="tecnologia" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
                            <option value="">Seleccione una opción...</option>
                            <option value="Energía Renovable">Energía Renovable</option>
                            <option value="Movilidad Urbana">Movilidad Urbana</option>
                            <option value="Telecomunicaciones">Telecomunicaciones</option>
                            <option value="Tratamiento de Agua">Tratamiento de Agua</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div style="flex: 1;">
                        <label style="font-weight: bold; color: #333;">Presupuesto Estimado (MXN)</label>
                        <input type="number" id="presupuesto" required placeholder="$ 0.00" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-weight: bold; color: #333;">Progreso Inicial (%)</label>
                        <input type="number" id="progreso" value="0" min="0" max="100" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; color: #333;">Ubicación Exacta (Mueva el pin azul al lugar del proyecto)</label>
                    <div id="mapa" style="height: 300px; width: 100%; border-radius: 8px; border: 1px solid #ccc; margin-top: 5px;"></div>
                    <input type="hidden" id="coordenadas" value="25.8156, -100.5958">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; color: #333;">Descripción del Proyecto</label>
                    <textarea id="descripcion" required rows="4" placeholder="Describa el impacto de esta infraestructura..." style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; resize: vertical;"></textarea>
                </div>

                <button type="button" id="btnEnviarReporte" style="width: 100%; padding: 15px; background-color: #f39c12; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;">
                    🚀 Enviar Reporte al Sistema
                </button>
            </form>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBVNkeV1ac6fs-hqzQeBZY1sQ79qoXdHLk",
            authDomain: "infradata-ec24a.firebaseapp.com",
            projectId: "infradata-ec24a",
            storageBucket: "infradata-ec24a.firebasestorage.app",
            messagingSenderId: "574865726695",
            appId: "1:574865726695:web:b19b5c639c0f8b8b475642",
            measurementId: "G-G6GG8L8HLR"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // INICIALIZAR EL MAPA (Centrado en García, N.L.)
        var map = L.map('mapa').setView([25.8156, -100.5958], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
        var marker = L.marker([25.8156, -100.5958], {draggable: true}).addTo(map);
        
        marker.on('dragend', function (e) {
            var posicion = marker.getLatLng();
            document.getElementById('coordenadas').value = posicion.lat.toFixed(5) + ", " + posicion.lng.toFixed(5);
        });

        // LÓGICA DEL BOTÓN ENVIAR REPORTE
        document.getElementById('btnEnviarReporte').addEventListener('click', async () => {
            const form = document.getElementById('formReporte');
            if(!form.reportValidity()) return; // Valida que los campos no estén vacíos

            // Animación de carga profesional
            Swal.fire({
                title: 'Enviando reporte...',
                text: 'Guardando datos en la nube',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                await addDoc(collection(db, "reportes"), {
                    proyecto: document.getElementById('nombreProyecto').value.trim(),
                    tecnologia: document.getElementById('tecnologia').value,
                    presupuesto: parseFloat(document.getElementById('presupuesto').value),
                    progreso: document.getElementById('progreso').value,
                    coordenadas: document.getElementById('coordenadas').value,
                    descripcion: document.getElementById('descripcion').value.trim(),
                    estado: "Pendiente",
                    fecha: new Date().toLocaleDateString()
                });
                
                // Alerta de Éxito
                Swal.fire({
                    icon: 'success',
                    title: '¡Reporte Enviado!',
                    text: 'La infraestructura ha sido registrada con éxito.',
                    confirmButtonColor: '#2ecc71'
                });
                
                form.reset(); // Limpia el formulario
                marker.setLatLng([25.8156, -100.5958]); // Regresa el pin a su lugar
                map.setView([25.8156, -100.5958], 13);

            } catch (error) {
                console.error("Error al registrar:", error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo guardar el reporte.' });
            }
        });
    </script>
</body>
</html>
